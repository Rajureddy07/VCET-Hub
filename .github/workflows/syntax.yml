name: Python syntax

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend sources
        run: python -m compileall -q "vcet circle/backend/app.py" "vcet circle/backend/news.py" "vcet circle/backend/train_bot.py"
